name: Promote UAT

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types:
      - closed
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID || '881933021016' }}
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME }}
  EKS_CLUSTER_UAT: ${{ vars.EKS_CLUSTER_UAT || vars.EKS_CLUSTER_DEV || 'usfarcade-dev' }}
  K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE || 'usfarcade' }}

jobs:
  gate:
    name: Check UAT promotion trigger
    runs-on: ubuntu-latest
    outputs:
      promote: ${{ steps.gate.outputs.promote }}
      image_tag: ${{ steps.gate.outputs.image_tag }}
    steps:
      - id: gate
        shell: bash
        run: |
          set -euo pipefail

          promote=false

          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.pull_request.merged }}" = "true" ]; then
            promote=true
          fi

          if [ "${{ github.event_name }}" = "push" ]; then
            message="$(jq -r '.head_commit.message // ""' "${GITHUB_EVENT_PATH}")"
            if [[ "${message}" =~ (^|[[:space:]])[Rr][Cc][0-9]+($|[[:space:]:-]) ]] || [[ "${message}" =~ ^(chore|release)(\(.+\))?:[[:space:]]*[Rr][Cc] ]]; then
              promote=true
            fi
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            promote=true
          fi

          tag="rc-${{ github.run_number }}-${GITHUB_SHA}"
          echo "promote=${promote}" >> "${GITHUB_OUTPUT}"
          echo "image_tag=${tag}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build UAT ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.promote == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            context: frontend
          - service: player-service
            context: services/player-service
          - service: game-service
            context: services/game-service
          - service: score-service
            context: services/score-service
          - service: leaderboard-service
            context: services/leaderboard-service
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - uses: ./.github/actions/build-ecr-image
        with:
          aws-account-id: ${{ env.AWS_ACCOUNT_ID }}
          aws-region: ${{ env.AWS_REGION }}
          service: ${{ matrix.service }}
          context: ${{ matrix.context }}
          image-tag: ${{ needs.gate.outputs.image_tag }}
          extra-tags: rc

  deploy:
    name: Deploy UAT
    runs-on: ubuntu-latest
    needs:
      - gate
      - build
    if: needs.gate.outputs.promote == 'true'
    environment: uat
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: ./.github/actions/deploy-k8s-overlay
        with:
          aws-account-id: ${{ env.AWS_ACCOUNT_ID }}
          aws-region: ${{ env.AWS_REGION }}
          cluster-name: ${{ env.EKS_CLUSTER_UAT }}
          overlay: uat
          namespace: ${{ env.K8S_NAMESPACE }}
          image-tag: ${{ needs.gate.outputs.image_tag }}
          run-migrations: "true"
