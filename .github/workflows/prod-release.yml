name: Release Production

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write

env:
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID || '881933021016' }}
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME }}
  EKS_CLUSTER_PROD: ${{ vars.EKS_CLUSTER_PROD || 'usfarcade-prod' }}
  K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE || 'usfarcade' }}
  IMAGE_TAG: ${{ github.ref_name }}

jobs:
  build:
    name: Build Prod ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            context: frontend
          - service: player-service
            context: services/player-service
          - service: game-service
            context: services/game-service
          - service: score-service
            context: services/score-service
          - service: leaderboard-service
            context: services/leaderboard-service
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - uses: ./.github/actions/build-ecr-image
        with:
          aws-account-id: ${{ env.AWS_ACCOUNT_ID }}
          aws-region: ${{ env.AWS_REGION }}
          service: ${{ matrix.service }}
          context: ${{ matrix.context }}
          image-tag: ${{ env.IMAGE_TAG }}
          extra-tags: stable

  deploy:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: build
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: ./.github/actions/deploy-k8s-overlay
        with:
          aws-account-id: ${{ env.AWS_ACCOUNT_ID }}
          aws-region: ${{ env.AWS_REGION }}
          cluster-name: ${{ env.EKS_CLUSTER_PROD }}
          overlay: prod
          namespace: ${{ env.K8S_NAMESPACE }}
          image-tag: ${{ env.IMAGE_TAG }}
          run-migrations: "true"
