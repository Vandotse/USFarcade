name: Nightly QA Build

on:
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: read
  id-token: write

env:
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID || '881933021016' }}
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME }}
  IMAGE_TAG: qa-${{ github.run_number }}-${{ github.sha }}

jobs:
  validate:
    name: QA validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check backend syntax
        run: npm run check

      - name: Build frontend
        run: |
          npm --prefix frontend ci
          npm run frontend:build

  build:
    name: Build QA ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            context: frontend
          - service: player-service
            context: services/player-service
          - service: game-service
            context: services/game-service
          - service: score-service
            context: services/score-service
          - service: leaderboard-service
            context: services/leaderboard-service
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - uses: ./.github/actions/build-ecr-image
        with:
          aws-account-id: ${{ env.AWS_ACCOUNT_ID }}
          aws-region: ${{ env.AWS_REGION }}
          service: ${{ matrix.service }}
          context: ${{ matrix.context }}
          image-tag: ${{ env.IMAGE_TAG }}
          extra-tags: qa
