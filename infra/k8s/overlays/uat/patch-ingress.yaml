apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: usfarcade
  namespace: usfarcade
  annotations:
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:REGION:ACCOUNT_ID:certificate/UAT_CERT_ID
spec:
  rules:
    - host: uat.arcade.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
