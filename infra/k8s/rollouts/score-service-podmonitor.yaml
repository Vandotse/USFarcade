apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: score-service
  namespace: usfarcade
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: score-service
  podMetricsEndpoints:
    - port: http
      path: /metrics
      interval: 30s
