apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: score-service
  namespace: usfarcade
spec:
  replicas: 3
  workloadRef:
    apiVersion: apps/v1
    kind: Deployment
    name: score-service
    scaleDown: onsuccess
  strategy:
    canary:
      maxUnavailable: 0
      maxSurge: 1
      steps:
        - setWeight: 10
        - pause:
            duration: 2m
        - setWeight: 50
        - pause:
            duration: 5m
        - setWeight: 100
      analysis:
        templates:
          - templateName: score-service-http-5xx-rate
        args:
          - name: service-name
            value: score-service
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/component: score-service
