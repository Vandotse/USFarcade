apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: score-service
  namespace: usfarcade
spec:
  replicas: 3
  strategy:
    canary:
      maxUnavailable: 0
      maxSurge: 1
      steps:
        - setWeight: 10
        - pause:
            duration: 2m
        - setWeight: 50
        - pause:
            duration: 5m
        - setWeight: 100
      analysis:
        templates:
          - templateName: http-success-rate
        args:
          - name: service-name
            value: score-service
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/component: score-service
  template:
    metadata:
      labels:
        app.kubernetes.io/component: score-service
        app.kubernetes.io/part-of: usfarcade
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: score-service
          image: ghcr.io/OWNER/USFarcade/score-service:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: usfarcade-config
            - secretRef:
                name: usfarcade-db
          env:
            - name: PORT
              value: "3003"
            - name: SERVICE_NAME
              value: score-service
          ports:
            - name: http
              containerPort: 3003
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 600m
              memory: 384Mi

