apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: score-service
  namespace: usfarcade
spec:
  scaleTargetRef:
    apiVersion: argoproj.io/v1alpha1
    kind: Rollout
    name: score-service
  minReplicas: 3
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
