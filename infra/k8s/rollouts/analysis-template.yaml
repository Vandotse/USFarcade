apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: score-service-http-5xx-rate
  namespace: usfarcade
spec:
  args:
    - name: service-name
  metrics:
    - name: http-5xx-rate
      interval: 60s
      count: 3
      successCondition: result[0] <= 0
      failureLimit: 1
      provider:
        prometheus:
          address: http://prometheus-operated.monitoring.svc.cluster.local:9090
          query: |
            sum(rate(http_requests_total{namespace="usfarcade",service="{{args.service-name}}",status=~"5.."}[2m]))
